services:

  # Run once to build/refresh the database: docker compose --profile build run --rm build-db
  build-db:
    build:
      context: .
      dockerfile: Dockerfile.api
    command:
      - python3
      - -m
      - db.build_db
      - --start-year
      - "${START_YEAR:-2015}"
      - --data-dir
      - /data
      - --db-path
      - /data/grants.db
    volumes:
      - ${DATA_DIR:-./data}:/data   # writable: build-db writes here
    restart: "no"
    profiles:
      - build

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      GRANTS_DB_PATH: /data/grants.db
    volumes:
      - ${DATA_DIR:-./data}:/data:ro   # bind-mount the host data directory read-only
    ports:
      - "8000:8000"   # exposes GraphiQL at http://localhost:8000/graphql
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"     # app available at http://localhost:3000
    depends_on:
      - api
    restart: unless-stopped
